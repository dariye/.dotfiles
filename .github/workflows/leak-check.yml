name: leak-check
on: [push, pull_request]
jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Work-content and secret patterns
        run: scripts/leak-check
      - name: shellcheck
        run: shellcheck -S warning mac-setup scripts/leak-check scripts/doctor .githooks/pre-commit
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
